name: CI

on:
  push:
    branches:
      - main
      - fdmonroy/main
  pull_request:
    branches:
      - main
      - fdmonroy/main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run linter
        run: uv run ruff check --select E4,E7,E9,F .

      - name: Run tests
        run: uv run pytest

  deploy:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fdmonroy/main')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set; skipping deploy."
            exit 0
          fi
          DEPLOY_URL="${RENDER_DEPLOY_HOOK_URL}"
          if [ "${GITHUB_REF}" = "refs/heads/fdmonroy/main" ]; then
            case "${DEPLOY_URL}" in
              *\?*) DEPLOY_URL="${DEPLOY_URL}&ref=${GITHUB_SHA}" ;;
              *) DEPLOY_URL="${DEPLOY_URL}?ref=${GITHUB_SHA}" ;;
            esac
          fi
          curl -fsSL -X POST "${DEPLOY_URL}"

