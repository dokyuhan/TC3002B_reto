[project]
name = "tc3002b-reto"
version = "0.1.0"
description = "Source code AST preprocessing for plagiarism detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.5",
    "polars>=2.1.0",
    "scikit-learn>=1.9.1",
    "tree-sitter>=0.26.1",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-python>=0.25.0",
]

[dependency-groups]
dev = [
    "prek>=0.5.11",
    "ruff>=0.11.0",
]
