[project]
name = "tc3002b-reto"
version = "0.1.0"
description = "Source code plagiarism and AI code detection system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.5",
    "pygments>=2.21.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
